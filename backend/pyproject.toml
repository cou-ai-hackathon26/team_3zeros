[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medi-waypoint-backend"
version = "0.1.0"
description = "Medi Waypoint — Django + DRF backend for Bangladesh healthcare referral & triage"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15.0",
    "django-environ>=0.11.0",
    "drf-spectacular>=0.27.0",
    "channels>=4.0.0",
    "celery>=5.3.0",
    "structlog>=24.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "factory-boy>=3.3.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --nomigrations"
testpaths = ["tests", "apps"]
python_files = ["test_*.py", "*_test.py"]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["."]
