name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend:
    name: Backend Tests & Contracts
    runs-on: ubuntu-latest
    services:
      postgres:  # pgvector, the same image as docker-compose (MASTERPLAN D-32)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: medi_waypoint
          POSTGRES_USER: medi
          POSTGRES_PASSWORD: medi_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medi -d medi_waypoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://medi:medi_secret@localhost:5432/medi_waypoint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Run Pytest
        run: |
          cd backend
          pytest -q

  frontend:
    name: Frontend Verification & Budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Design System Tokens
        run: |
          cd frontend
          npm run tokens:check
          npm run lint:tokens
          npm run content:check

      - name: Run TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npm test

      - name: Check Patient Route Bundle Budgets
        run: |
          cd frontend
          npm run budgets:check
